name: Release

# release-please maintains the release pull request, the changelogs and the
# version bumps. Nothing is published to npm: releases are GitHub releases
# with the packed tarballs, built by github-release.yml when a `v*` tag is
# pushed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'mi-skam/vivid'
    runs-on: ubuntu-latest
    steps:
      - name: Create release pull request
        uses: googleapis/release-please-action@v4
